version: '3.8'

services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node1-data:/var/lib/cassandra
    restart: unless-stopped

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node2-data:/var/lib/cassandra
    depends_on:
      - cassandra-node1
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  cassandra-backup-local:
    image: alpine:latest
    container_name: cassandra-backup-local
    volumes:
      - cassandra-node1-data:/cassandra-data:ro
      - ./Backups_Auto_MarketUEES:/backups
    depends_on:
      - cassandra-node1
    entrypoint: >
      sh -c "
        apk add --no-cache dcron &&
        mkdir -p /backups &&
        echo '0 2 * * * cp -r /cassandra-data/data/marketuees /backups/backup_\$\$(date +\%Y\%m\%d_\%H\%M\%S) && find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +' > /etc/crontabs/root &&
        crond -f
      "
    restart: unless-stopped

  cassandra-backup-minio:
    image: alpine:latest
    container_name: cassandra-backup-minio
    volumes:
      - cassandra-node1-data:/cassandra-data:ro
    depends_on:
      - cassandra-node1
      - minio
    entrypoint: >
      sh -c "
        apk add --no-cache dcron aws-cli &&
        aws configure set aws_access_key_id admin &&
        aws configure set aws_secret_access_key admin123 &&
        aws configure set default.region us-east-1 &&
        aws --endpoint-url http://minio:9000 s3 mb s3://cassandra-backups --region us-east-1 || true &&
        echo '0 2 * * * aws --endpoint-url http://minio:9000 s3 cp /cassandra-data/data/marketuees s3://cassandra-backups/backup_\$\$(date +\%Y\%m\%d_\%H\%M\%S) --recursive' > /etc/crontabs/root &&
        crond -f
      "
    restart: unless-stopped

volumes:
  cassandra-node1-data:
  cassandra-node2-data:
  minio-data: