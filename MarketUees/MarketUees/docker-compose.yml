version: '3.8'

services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node1-data:/var/lib/cassandra

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node2-data:/var/lib/cassandra
    depends_on:
      - cassandra-node1

  cassandra-backup:
    image: alpine:latest
    container_name: cassandra-backup
    volumes:
      - cassandra-node1-data:/cassandra-data:ro
      - ./Backups_Auto_MarketUEES:/backups
    depends_on:
      - cassandra-node1
    entrypoint: >
      sh -c "
        apk add --no-cache dcron &&
        mkdir -p /backups &&
        echo '0 2 * * * cp -r /cassandra-data/marketuees /backups/backup_\$\$(date +\%Y\%m\%d_\%H\%M\%S) && find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +' > /etc/crontabs/root &&
        crond -f
      "
    restart: unless-stopped

volumes:
  cassandra-node1-data:
  cassandra-node2-data: