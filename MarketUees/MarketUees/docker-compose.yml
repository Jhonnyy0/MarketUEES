services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node1-data:/var/lib/cassandra
    restart: unless-stopped

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MarketUEESCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra-node2-data:/var/lib/cassandra
    depends_on:
      - cassandra-node1
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  cassandra-backup-minio-export:
    image: cassandra:4.1
    container_name: cassandra-backup-minio-export
    environment:
      - TZ=America/El_Salvador
    volumes:
      - ./Backups_Minio_MarketUEES:/minio-work
      - ./Backup_Lock_MarketUEES:/backup-lock
    depends_on:
      - cassandra-node1
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /minio-work
        while ! cqlsh cassandra-node1 -e "DESCRIBE KEYSPACE marketuees" >/dev/null 2>&1; do
          echo "Esperando Cassandra para backup MinIO..."
          sleep 10
        done
        while true; do
          NOW=$$(date +%s)
          TARGET=$$(date -d "today 02:00" +%s)
          if [ "$$NOW" -ge "$$TARGET" ]; then
            TARGET=$$(date -d "tomorrow 02:00" +%s)
          fi
          WAIT=$$((TARGET - NOW))
          echo "Proximo backup MinIO automatico en $$WAIT segundos."
          sleep "$$WAIT"
          TAG="backup_minio_$$(date +%Y%m%d_%H%M%S)"
          DEST="/minio-work/$$TAG"
          if [ -f /backup-lock/backup.lock ]; then
            echo "Hay otro backup en proceso. Se intentara en 60 segundos."
            sleep 60
            continue
          fi
          echo backup_minio_automatico > /backup-lock/backup.lock
          mkdir -p "$$DEST"
          cqlsh cassandra-node1 -e "COPY marketuees.vistas_contenido TO '$$DEST/vistas_contenido.csv' WITH HEADER = TRUE;"
          cqlsh cassandra-node1 -e "COPY marketuees.actividad_usuario TO '$$DEST/actividad_usuario.csv' WITH HEADER = TRUE;"
          rm -f /backup-lock/backup.lock
          echo "Backup MinIO preparado: $$TAG"
        done
    restart: unless-stopped

  cassandra-backup-minio:
    image: minio/mc:latest
    container_name: cassandra-backup-minio
    volumes:
      - ./Backups_Minio_MarketUEES:/minio-work
    depends_on:
      - cassandra-backup-minio-export
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set localminio http://minio:9000 admin admin123 >/dev/null 2>&1; do
          echo "Esperando MinIO..."
          sleep 10
        done
        mc mb -p localminio/cassandra-backups || true
        while true; do
          SRC=""
          for DIR in /minio-work/backup_minio_*; do
            [ -d "$$DIR" ] || continue
            [ -f "$$DIR/.uploaded" ] && continue
            SRC="$$DIR"
            break
          done
          if [ -n "$$SRC" ]; then
            TAG="$$(basename "$$SRC")"
            mc cp --recursive "$$SRC/" "localminio/cassandra-backups/$$TAG/"
            echo "Backup MinIO creado: $$TAG"
            touch "$$SRC/.uploaded"
          else
            echo "No hay backup MinIO pendiente para subir."
          fi
          sleep 60
        done
    restart: unless-stopped

volumes:
  cassandra-node1-data:
  cassandra-node2-data:
  minio-data:
